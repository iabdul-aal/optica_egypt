name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Typecheck, Validate, Unit Tests, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run quality gates (lint, typecheck, validate)
        run: npm run check
      - name: Run unit tests
        run: npm run test:unit
      - name: Build production server bundle
        run: npm run build
