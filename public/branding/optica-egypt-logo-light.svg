<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160" fill="none">
  <rect width="680" height="160" rx="8" fill="#F8FAFC"/>
  <rect x="1" y="1" width="678" height="158" rx="7" stroke="#09131F" stroke-opacity="0.12" stroke-width="2"/>
  <!-- Subtle optical grid lines -->
  <line x1="0" y1="80" x2="680" y2="80" stroke="#09131F" stroke-opacity="0.06" stroke-dasharray="4 4"/>
  <line x1="88" y1="0" x2="88" y2="160" stroke="#09131F" stroke-opacity="0.06" stroke-dasharray="4 4"/>
  <!-- Concentric Optical Ring Emblem -->
  <circle cx="88" cy="80" r="46" stroke="#A67C1E" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="88" cy="80" r="32" stroke="#09131F" stroke-width="3"/>
  <!-- Gold Laser Core Marker -->
  <rect x="76" y="68" width="24" height="24" fill="#D4AF37"/>
  <!-- Laser Beam Axis -->
  <line x1="112" y1="80" x2="152" y2="80" stroke="#A67C1E" stroke-width="2.5"/>
  <!-- Brand Typography -->
  <text x="168" y="82" fill="#09131F" font-family="Montserrat, Inter, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Optica Egypt</text>
  <text x="170" y="114" fill="#A67C1E" font-family="Montserrat, Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="6">LOCAL SECTION</text>
</svg>
